<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora Travels — Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ============================================================
           AURORA TRAVELS — Login/Register Page
           Matches style.css color palette & design language
           ============================================================ */

        /* ---- CSS Variables (aligned with style.css) ---- */
        :root {
            --primary: #2563EB;
            --secondary: #0EA5E9;
            --accent: #06B6D4;
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #1E293B;
            --text-light: #64748B;
            --glass-bg: rgba(255, 255, 255, 0.18);
            --glass-border: rgba(255, 255, 255, 0.35);
            --shadow: 0 8px 32px rgba(37, 99, 235, 0.12);
            --shadow-lg: 0 20px 60px rgba(37, 99, 235, 0.18);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --nav-h: 72px;
        }

        /* Dark mode (matches style.css) */
        body.dark {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #F1F5F9;
            --text-light: #94A3B8;
            --glass-bg: rgba(30, 41, 59, 0.72);
            --glass-border: rgba(148, 163, 184, 0.18);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        /* ---- Reset & Base ---- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            transition: background 0.4s, color 0.4s;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ---- App Container ---- */
        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        #app.fade-out {
            opacity: 0;
            transform: scale(0.96);
        }

        /* ---- Animated Background (matching index.html hero) ---- */
        #app::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #1E40AF 0%, #0EA5E9 40%, #06B6D4 75%, #0891B2 100%);
            opacity: 0.15;
            z-index: 0;
            animation: gradientShift 18s ease-in-out infinite alternate;
        }

        @keyframes gradientShift {
            0% {
                opacity: 0.12;
                transform: scale(1);
            }
            50% {
                opacity: 0.22;
                transform: scale(1.02);
            }
            100% {
                opacity: 0.12;
                transform: scale(1);
            }
        }

        #app::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 30% 20%, rgba(37, 99, 235, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 50%);
            z-index: 0;
        }

        /* ---- Floating Orbs (matching style.css particles) ---- */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 25s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            top: -200px;
            right: -100px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.20), transparent 70%);
            animation-duration: 22s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            bottom: -150px;
            left: -80px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.18), transparent 70%);
            animation-duration: 28s;
            animation-direction: alternate-reverse;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(60px, -40px) scale(1.15);
            }
        }

        /* ---- Auth Card (glassmorphism) ---- */
        .auth-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 2;
        }

        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 44px 38px 38px;
            box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: var(--transition);
        }

        .auth-card:hover {
            box-shadow: 0 30px 80px rgba(37, 99, 235, 0.20);
        }

        /* ---- Brand ---- */
        .auth-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-brand .logo-icon {
            font-size: 28px;
            color: var(--primary);
            margin-bottom: 4px;
            display: inline-block;
        }

        .auth-brand h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 26px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-brand .sub {
            font-size: 13px;
            color: var(--text-light);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 300;
            margin-top: 2px;
        }

        /* ---- Forms ---- */
        .auth-form {
            display: block;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .auth-form.hidden {
            display: none;
        }

        .auth-form .form-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
            color: var(--text);
        }

        .auth-form .form-sub {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 24px;
            font-weight: 300;
        }

        /* ---- Form Groups ---- */
        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-light);
            margin-bottom: 6px;
        }

        .form-group .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid var(--glass-border);
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .form-group .input-wrap:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
            background: rgba(255, 255, 255, 0.08);
        }

        body.dark .form-group .input-wrap {
            background: rgba(255, 255, 255, 0.04);
        }

        body.dark .form-group .input-wrap:focus-within {
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.20);
        }

        .form-group .input-wrap i {
            color: var(--text-light);
            font-size: 15px;
            padding: 0 0 0 16px;
            width: 20px;
            transition: color 0.3s;
        }

        .form-group .input-wrap:focus-within i {
            color: var(--primary);
        }

        .form-group .input-wrap input {
            width: 100%;
            padding: 14px 16px 14px 12px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
        }

        .form-group .input-wrap input::placeholder {
            color: rgba(100, 116, 139, 0.4);
            font-weight: 300;
        }

        body.dark .form-group .input-wrap input::placeholder {
            color: rgba(148, 163, 184, 0.35);
        }

        .form-group .input-wrap .toggle-pw {
            padding-right: 14px;
            cursor: pointer;
            color: var(--text-light);
            font-size: 14px;
            transition: color 0.3s;
            background: none;
            border: none;
        }

        .form-group .input-wrap .toggle-pw:hover {
            color: var(--text);
        }

        /* ---- Form Options ---- */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0 22px;
            font-size: 13px;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-light);
            cursor: pointer;
            font-weight: 300;
        }

        .form-options label input[type="checkbox"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .form-options a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
            transition: color 0.3s;
        }

        .form-options a:hover {
            color: var(--secondary);
            text-decoration: underline;
        }

        /* ---- Buttons (matching style.css) ---- */
        .btn-gold {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(37, 99, 235, 0.50);
        }

        .btn-gold:active {
            transform: scale(0.98);
        }

        .btn-gold .btn-loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        .btn-gold.loading .btn-text {
            display: none;
        }
        .btn-gold.loading .btn-loader {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---- Auth Switch ---- */
        .auth-switch {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-light);
        }

        .auth-switch a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s;
        }

        .auth-switch a:hover {
            color: var(--secondary);
            text-decoration: underline;
        }

        /* ---- Error & Success Messages ---- */
        .auth-error {
            background: rgba(239, 68, 68, 0.10);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #EF4444;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .auth-error.show {
            display: flex;
        }

        .auth-error i {
            font-size: 16px;
        }

        /* ---- Success banners (two types: success for login, info for registration) ---- */
        .success-banner {
            display: none;
            text-align: center;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            margin-bottom: 16px;
        }

        .success-banner.show {
            display: block;
        }

        .success-banner.success {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.30);
            color: #059669;
        }

        .success-banner.info {
            background: rgba(37, 99, 235, 0.10);
            border: 1px solid rgba(37, 99, 235, 0.25);
            color: var(--primary);
        }

        /* ---- Theme Toggle (floating, matches style.css) ---- */
        .theme-toggle-fab {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 999;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--card);
            border: 2px solid var(--glass-border);
            box-shadow: var(--shadow);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            color: var(--text);
        }

        .theme-toggle-fab:hover {
            transform: scale(1.08);
            box-shadow: var(--shadow-lg);
        }

        /* ---- Responsive ---- */
        @media (max-width: 640px) {
            .auth-card {
                padding: 30px 20px 26px;
            }
        }

        @media (max-width: 420px) {
            .auth-card {
                padding: 24px 14px 20px;
            }
            .form-options {
                flex-wrap: wrap;
                gap: 8px;
            }
            .theme-toggle-fab {
                bottom: 16px;
                right: 16px;
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div id="app">

        <!-- Floating Orbs -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>

        <!-- Theme Toggle (floating FAB) -->
        <button class="theme-toggle-fab" id="themeToggle" title="Toggle dark mode">🌙</button>

        <div class="auth-container">

            <div class="auth-card">

                <!-- Brand -->
                <div class="auth-brand">
                    <div class="logo-icon"><i class="fas fa-plane-departure"></i></div>
                    <h1>Aurora Travels</h1>
                    <div class="sub">Luxury Journeys</div>
                </div>

                <!-- Error message -->
                <div id="auth-error" class="auth-error">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="auth-error-text">Invalid credentials</span>
                </div>

                <!-- Success / Info banners -->
                <div id="success-banner" class="success-banner">
                    <i class="fas fa-check-circle" style="margin-right: 8px;"></i>
                    <span id="banner-text">Success!</span>
                </div>

                <!-- ========== LOGIN FORM ========== -->
                <form id="login-form" class="auth-form" autocomplete="off" novalidate>
                    <div class="form-title">Welcome Back</div>
                    <div class="form-sub">Sign in to continue your journey.</div>

                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <div class="input-wrap">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="login-email" placeholder="you@example.com" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <div class="input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="login-password" placeholder="••••••••" required />
                            <button type="button" class="toggle-pw" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label>
                            <input type="checkbox" checked /> Remember me
                        </label>
                        <a href="#">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-gold" id="login-btn">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-loader"></span>
                    </button>

                    <div class="auth-switch">
                        Don't have an account? <a id="switch-to-register">Register</a>
                    </div>
                </form>

                <!-- ========== REGISTER FORM ========== -->
                <form id="register-form" class="auth-form hidden" autocomplete="off" novalidate>
                    <div class="form-title">Create Account</div>
                    <div class="form-sub">Start your luxury journey today.</div>

                    <div class="form-group">
                        <label for="reg-name">Full Name</label>
                        <div class="input-wrap">
                            <i class="fas fa-user"></i>
                            <input type="text" id="reg-name" placeholder="James Morrison" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reg-email">Email</label>
                        <div class="input-wrap">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="reg-email" placeholder="you@example.com" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <div class="input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="reg-password" placeholder="Min 6 characters" required minlength="6" />
                            <button type="button" class="toggle-pw" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reg-confirm">Confirm Password</label>
                        <div class="input-wrap">
                            <i class="fas fa-check-circle"></i>
                            <input type="password" id="reg-confirm" placeholder="Confirm your password" required />
                        </div>
                    </div>

                    <button type="submit" class="btn-gold" id="register-btn">
                        <span class="btn-text">Create Account</span>
                        <span class="btn-loader"></span>
                    </button>

                    <div class="auth-switch">
                        Already have an account? <a id="switch-to-login">Sign In</a>
                    </div>
                </form>

            </div><!-- /auth-card -->
        </div><!-- /auth-container -->

    </div><!-- /app -->


    <!-- ============================================================
    JAVASCRIPT — Real localStorage authentication
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ----- DOM refs -----
            const app = document.getElementById('app');
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const switchToRegister = document.getElementById('switch-to-register');
            const switchToLogin = document.getElementById('switch-to-login');
            const loginBtn = document.getElementById('login-btn');
            const registerBtn = document.getElementById('register-btn');
            const authError = document.getElementById('auth-error');
            const authErrorText = document.getElementById('auth-error-text');
            const successBanner = document.getElementById('success-banner');
            const bannerText = document.getElementById('banner-text');
            const themeToggle = document.getElementById('themeToggle');

            // toggle password buttons
            const togglePwBtns = document.querySelectorAll('.toggle-pw');

            // ----- Dark / Light Mode (matching style.css) -----
            let isDark = localStorage.getItem('aurora-theme') === 'dark';
            if (isDark) {
                document.body.classList.add('dark');
                themeToggle.textContent = '☀️';
            }

            themeToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark');
                isDark = document.body.classList.contains('dark');
                themeToggle.textContent = isDark ? '☀️' : '🌙';
                localStorage.setItem('aurora-theme', isDark ? 'dark' : 'light');
            });

            // ----- localStorage user management -----
            function getUsers() {
                try {
                    return JSON.parse(localStorage.getItem('aurora_users')) || [];
                } catch {
                    return [];
                }
            }

            function saveUsers(users) {
                localStorage.setItem('aurora_users', JSON.stringify(users));
            }

            function findUserByEmail(email) {
                const users = getUsers();
                return users.find(u => u.email.toLowerCase() === email.toLowerCase()) || null;
            }

            function registerUser(name, email, password) {
                const users = getUsers();
                if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
                    throw new Error('An account with this email already exists.');
                }
                users.push({ name: name.trim(), email: email.trim(), password: password });
                saveUsers(users);
                return { name: name.trim(), email: email.trim() };
            }

            function loginUser(email, password) {
                const user = findUserByEmail(email);
                if (!user) {
                    throw new Error('No account found with this email.');
                }
                if (user.password !== password) {
                    throw new Error('Incorrect password.');
                }
                return { name: user.name, email: user.email };
            }

            // ----- Helpers -----
            function showError(msg) {
                authErrorText.textContent = msg || 'Something went wrong.';
                authError.classList.add('show');
                hideBanner();
            }

            function hideError() {
                authError.classList.remove('show');
            }

            function showBanner(text, type) {
                successBanner.className = 'success-banner show ' + (type || 'success');
                bannerText.textContent = text;
                hideError();
            }

            function hideBanner() {
                successBanner.className = 'success-banner';
            }

            function setLoading(btn, loading) {
                if (loading) {
                    btn.classList.add('loading');
                    btn.disabled = true;
                } else {
                    btn.classList.remove('loading');
                    btn.disabled = false;
                }
            }

            // ----- Redirect to index.html on login -----
            function redirectToHome(user) {
                showBanner(`Welcome, ${user.name}! Redirecting to homepage…`, 'success');

                // fade out the whole app
                app.classList.add('fade-out');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            }

            // ----- Show login form with an info message -----
            function showLoginFormWithMessage(message) {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                hideError();
                showBanner(message, 'info');
                setLoading(loginBtn, false);
                setLoading(registerBtn, false);
            }

            // ----- Show login form (no message) -----
            function showLoginForm() {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                hideError();
                hideBanner();
                setLoading(loginBtn, false);
                setLoading(registerBtn, false);
            }

            function showRegisterForm() {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                hideError();
                hideBanner();
                setLoading(loginBtn, false);
                setLoading(registerBtn, false);
            }

            // ----- event: switch to register -----
            switchToRegister.addEventListener('click', (e) => {
                e.preventDefault();
                showRegisterForm();
            });

            switchToLogin.addEventListener('click', (e) => {
                e.preventDefault();
                showLoginForm();
            });

            // ----- event: toggle password visibility -----
            togglePwBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const input = this.closest('.input-wrap').querySelector('input');
                    const icon = this.querySelector('i');
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.className = 'fas fa-eye-slash';
                    } else {
                        input.type = 'password';
                        icon.className = 'fas fa-eye';
                    }
                });
            });

            // ----- event: login submit (real validation) -----
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideError();
                hideBanner();

                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;

                if (!email || !password) {
                    showError('Please fill in all fields.');
                    return;
                }

                setLoading(loginBtn, true);

                // Simulate network delay
                await new Promise(resolve => setTimeout(resolve, 600));

                try {
                    const user = loginUser(email, password);
                    setLoading(loginBtn, false);
                    redirectToHome(user);
                } catch (err) {
                    setLoading(loginBtn, false);
                    showError(err.message);
                }
            });

            // ----- event: register submit (real storage) -----
            registerForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideError();
                hideBanner();

                const name = document.getElementById('reg-name').value.trim();
                const email = document.getElementById('reg-email').value.trim();
                const password = document.getElementById('reg-password').value;
                const confirm = document.getElementById('reg-confirm').value;

                if (!name || !email || !password || !confirm) {
                    showError('Please fill in all fields.');
                    return;
                }
                if (password.length < 6) {
                    showError('Password must be at least 6 characters.');
                    return;
                }
                if (password !== confirm) {
                    showError('Passwords do not match.');
                    return;
                }

                setLoading(registerBtn, true);

                await new Promise(resolve => setTimeout(resolve, 600));

                try {
                    const user = registerUser(name, email, password);
                    setLoading(registerBtn, false);

                    // ✅ After registration, show login form with info message
                    showLoginFormWithMessage('🎉 Account created successfully! Please log in with your new credentials.');
                } catch (err) {
                    setLoading(registerBtn, false);
                    showError(err.message);
                }
            });

            // ----- Start: show login form by default -----
            // (already visible, but we ensure no messages)
            showLoginForm();

        })();
    </script>

</body>
</html>
